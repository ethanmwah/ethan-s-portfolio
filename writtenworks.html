<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Written Works - Ethan Thompson</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #dbd4cc;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Navigation back to home */
        .nav-back {
            text-align: left;
            margin-bottom: 40px;
        }

        .nav-back a {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 1.1em;
            color: #666;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .nav-back a:hover {
            color: #333;
        }

        /* Content section */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .content h1 {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .content p {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 1.2em;
            color: #666;
            font-weight: 400;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 2em;
            }
            
            .content p {
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .content h1 {
                font-size: 1.8em;
            }

            .content p {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-back">
            <a href="index.html">← back to projects</a>
        </div>
        
        <div class="content">
            <h1>written works</h1>
            <p>work in progress</p>
        </div>
    </div>
</body>
</html>
